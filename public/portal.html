<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff portal · Unicess</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sans: "Geist", ui-sans-serif, sans-serif;
    --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --paper: #f4f2ec; --panel: #fbfaf6; --hover: #efece4; --rule: #dcd8cc; --rule-strong: #bdb8aa;
    --ink: #16150f; --ink2: #3b392f; --muted: #6a665a; --faint: #969184;
    --accent: #0b6e4f; --accent-soft: #e1ede6; --signal: #c2410c; --signal-soft: #f9e7dc;
    --good: #0b6e4f; --good-soft: #e1ede6; --warn: #96600a; --warn-soft: #f4ead3; --bad: #b42318; --bad-soft: #f7e3df;
    --ask: #3f3d35; --admissions: #1f5fa8; --intl: #0f766e; --finaid: #b45309; --housing: #4d7c0f; --counselor: #be123c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; background: var(--paper); color: var(--ink); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }

  /* Sidebar, on ink */
  .sb { position: sticky; top: 0; height: 100vh; background: #0e0e0b; color: #f4f2ec; display: flex; flex-direction: column; border-right: 1px solid #000; }
  .sb-brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 18px; border-bottom: 1px solid #2b2a23; text-decoration: none; }
  .sb-brand img { width: 30px; height: 30px; display: block; }
  .sb-brand b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .sb-brand span { display: block; font: 500 10.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #a29d90; }
  .nav { display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; }
  .nav .grp { font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #78736a; padding: 14px 10px 8px; }
  .nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; color: #d9d5c9; text-decoration: none; font-size: 14px; font-weight: 500; border-left: 2px solid transparent; }
  .nav a:hover { background: #1d1c17; color: #f4f2ec; }
  .nav a.on { background: #1d1c17; color: #f4f2ec; border-left-color: #3ccf91; }
  .nav a em { font: 600 11px/1 var(--mono); font-style: normal; color: #a29d90; }
  .nav a em.hot { color: #0e0e0b; background: #ff8a4c; padding: 3px 6px; }
  .nav a .ext { width: 7px; height: 7px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; opacity: .7; }
  .me { margin-top: auto; padding: 16px 20px 20px; border-top: 1px solid #2b2a23; }
  .me b { display: block; font-size: 14px; font-weight: 600; }
  .me .mail { display: block; font: 500 11.5px/1.5 var(--mono); color: #a29d90; overflow-wrap: anywhere; }
  .me .via { display: inline-block; margin-top: 8px; font: 600 10px/1 var(--mono); letter-spacing: .1em; padding: 4px 6px; border: 1px solid #444137; color: #d9d5c9; }
  .me .via.demo { border-color: #f0b84a; color: #f0b84a; }
  .me form { margin-top: 14px; }
  .me button { width: 100%; padding: 9px 10px; background: transparent; border: 1px solid #444137; color: #d9d5c9; font-weight: 500; font-size: 13px; cursor: pointer; text-align: left; }
  .me button:hover { border-color: #f4f2ec; color: #f4f2ec; }

  /* Main column */
  .main { min-width: 0; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 28px 40px 18px; border-bottom: 1px solid var(--rule); background: var(--panel); }
  .topbar h1 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -0.03em; font-weight: 600; }
  .topbar p { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 640px; }
  .top-r { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font: 500 11.5px/1 var(--mono); color: var(--ink2); }
  .pill i { width: 7px; height: 7px; background: var(--good); }
  .pill.bad { color: var(--bad); } .pill.bad i { background: var(--bad); }
  .pill.rec { color: var(--warn); } .pill.rec i { background: var(--warn); }
  .view { padding: 28px 40px 72px; }
  .banner { margin: 0 0 22px; padding: 10px 14px; border-left: 3px solid var(--warn); background: var(--warn-soft); color: var(--warn); font-size: 13.5px; }

  /* Buttons */
  .b { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid var(--rule-strong); background: transparent; color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .b:hover:not(:disabled) { border-color: var(--ink); }
  .b.ink { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .b.ink:hover:not(:disabled) { background: #000; }
  .b.accent { background: var(--accent); border-color: var(--accent); color: #f4f2ec; }
  .b.accent:hover:not(:disabled) { background: #095c42; }
  .b:disabled { opacity: .45; cursor: not-allowed; }
  .b .tri { width: 8px; height: 9px; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); }

  /* Ruled KPI row */
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
  .kpi { padding: 14px 18px 16px; min-width: 0; }
  .kpi:first-child { padding-left: 0; }
  .kpi + .kpi { border-left: 1px solid var(--rule); }
  .kpi .k { font: 500 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v { font: 600 30px/1.15 var(--sans); letter-spacing: -0.035em; margin-top: 8px; }
  .kpi .v small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 3px; letter-spacing: 0; }
  .kpi .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi.hot .v { color: var(--signal); }
  .kpi.good .v { color: var(--good); }
  .kpi a { color: var(--signal); }

  /* Panels and tables */
  .cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-bottom: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--rule); min-width: 0; }
  .panel + .panel { margin-top: 24px; }
  .cols > .panel + .panel { margin-top: 0; }
  .ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--rule); }
  .ph h2 { margin: 0; font: 600 11.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .ph span, .ph a { font-size: 12.5px; color: var(--muted); }
  .ph a { text-decoration: none; font-weight: 600; color: var(--ink); }
  .ph a:hover { text-decoration: underline; }
  .pb { padding: 16px 18px; }
  .empty { padding: 26px 18px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
  table.t { width: 100%; border-collapse: collapse; }
  .t th { text-align: left; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 11px 18px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
  .t td { padding: 11px 18px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .t tr:last-child td { border-bottom: 0; }
  .t tr.click { cursor: pointer; }
  .t tr.click:hover td { background: var(--hover); }
  .t .sub { display: block; font: 500 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .t .tm { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .addr { font: 600 12px var(--mono); color: var(--c, var(--ink2)); white-space: nowrap; }
  .addr i { display: inline-block; width: 8px; height: 8px; background: var(--c); margin-right: 8px; }
  .out { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .out.good { color: var(--good); } .out.warn { color: var(--warn); } .out.bad { color: var(--bad); } .out.now { color: var(--signal); }
  .code { display: inline-block; font: 600 10px/1 var(--mono); letter-spacing: .1em; padding: 4px 6px; border: 1px solid currentColor; white-space: nowrap; }
  .code.approval { color: var(--warn); } .code.gap { color: var(--counselor); } .code.done { color: var(--good); } .code.bad { color: var(--bad); } .code.muted { color: var(--muted); }
  .chip { display: inline-block; font: 500 11px/1.5 var(--mono); padding: 0 7px; border: 1px solid var(--rule-strong); color: var(--ink2); }
  .chip.accent { border-color: var(--accent); color: var(--accent); }

  /* Lists inside panels */
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: baseline; padding: 12px 18px; border-bottom: 1px solid var(--rule); }
  .rows li:last-child { border-bottom: 0; }
  .rows .main-t { font-weight: 600; }
  .rows .main-t .addr { margin-left: 8px; font-weight: 600; }
  .rows .desc { color: var(--ink2); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows .when { font: 500 11.5px var(--mono); color: var(--faint); white-space: nowrap; }
  .rows .date { font: 600 12px var(--mono); color: var(--ink); white-space: nowrap; }
  .rows .date.soon { color: var(--signal); }

  /* Review queue */
  .seg { display: inline-flex; gap: 20px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; width: 100%; }
  .seg button { padding: 0 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: -1px; }
  .seg button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .seg button em { font: 600 11px var(--mono); font-style: normal; margin-left: 6px; color: var(--faint); }
  .item { background: var(--panel); border: 1px solid var(--rule); border-left: 3px solid var(--c, var(--rule-strong)); }
  .item + .item { margin-top: 16px; }
  .item-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--rule); }
  .item-h .who { font-weight: 600; font-size: 15px; }
  .item-h .sub { font: 500 12px var(--mono); color: var(--muted); }
  .item-h .age { margin-left: auto; font: 500 12px var(--mono); color: var(--faint); }
  .item-b { padding: 16px 20px 18px; }
  .lbl { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .lbl + * { margin-top: 0; }
  .req { margin: 0 0 16px; font-size: 15px; color: var(--ink); }
  .why { margin: 0 0 16px; font-size: 13.5px; color: var(--warn); }
  .draft { margin: 0 0 16px; padding: 12px 14px; background: var(--paper); border-left: 2px solid var(--rule-strong); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink2); font-size: 14px; }
  .item textarea { display: block; width: 100%; min-height: 120px; resize: vertical; padding: 12px 14px; border: 1px solid var(--rule-strong); background: #fff; font: 14px/1.55 var(--sans); color: var(--ink); margin: 0 0 8px; }
  .item textarea:focus { outline: 0; border-color: var(--accent); }
  .help { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .acts .note { font-size: 13px; color: var(--muted); }
  .acts .note.err { color: var(--bad); }
  .lock { margin-top: 2px; padding: 10px 12px; border-left: 2px solid var(--warn); background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .resolved-line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 13.5px; color: var(--ink2); }
  .resolved-line b { color: var(--good); }
  details.sent { margin-top: 10px; }
  details.sent summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
  details.sent pre { margin: 8px 0 0; padding: 12px 14px; background: var(--paper); white-space: pre-wrap; font: 13.5px/1.55 var(--sans); color: var(--ink2); }

  /* Applicants */
  .tools { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .tools input { flex: 1; min-width: 220px; max-width: 420px; padding: 10px 12px; border: 1px solid var(--rule-strong); background: #fff; font: 14px var(--sans); color: var(--ink); }
  .tools input:focus { outline: 0; border-color: var(--accent); }
  .tools span { color: var(--muted); font-size: 13px; }
  .prog { display: flex; align-items: center; gap: 10px; white-space: nowrap; font: 500 12px var(--mono); color: var(--muted); }
  .prog .bar { width: 72px; height: 4px; background: var(--rule); }
  .prog .bar i { display: block; height: 100%; background: var(--good); }
  .back { display: inline-block; margin-bottom: 16px; font-weight: 600; font-size: 13px; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--ink); }
  .who-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .who-h h2 { margin: 0; font-size: 24px; letter-spacing: -0.025em; font-weight: 600; }
  .who-mail { font: 500 12.5px var(--mono); color: var(--muted); margin-bottom: 22px; overflow-wrap: anywhere; }
  dl.props { display: grid; grid-template-columns: 140px minmax(0, 1fr); margin: 0; }
  .props dt, .props dd { padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .props dt { color: var(--muted); }
  .props dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
  .props dd.unknown { color: var(--faint); font-weight: 400; }
  .fund { display: flex; align-items: baseline; gap: 8px; }
  .fund b { font: 600 28px/1.1 var(--sans); letter-spacing: -0.035em; color: var(--bad); }
  .fund span { color: var(--muted); }
  .fbar { display: flex; height: 10px; background: var(--bad-soft); gap: 2px; margin: 12px 0 10px; }
  .fbar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; display: inline-block; }
  .legend b { color: var(--ink); }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .checks li:last-child { border-bottom: 0; }
  .checks .c { width: 13px; height: 13px; border: 1.5px solid var(--rule-strong); margin-top: 3px; position: relative; }
  .checks .received .c { background: var(--good); border-color: var(--good); }
  .checks .received .c::after { content: ""; position: absolute; left: 3px; top: 0; width: 4px; height: 7px; border-right: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(40deg); }
  .checks .missing .c { border-color: var(--bad); }
  .checks .if_parent .c { border-color: var(--warn); border-style: dashed; }
  .checks .t { font-weight: 500; }
  .checks .due { font: 500 11.5px var(--mono); color: var(--faint); }
  .checks .w { font: 600 10.5px/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .w.received { color: var(--good); } .w.missing { color: var(--bad); } .w.if_parent { color: var(--warn); } .w.not_needed { color: var(--faint); }
  .docs { list-style: none; margin: 0; padding: 0; }
  .docs li { padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .docs li:last-child { border-bottom: 0; }
  .docs b { display: block; font: 600 12.5px var(--mono); }
  .docs span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: grid; grid-template-columns: 70px 76px minmax(0, 1fr); gap: 10px; padding: 9px 18px; border-bottom: 1px dotted var(--rule); font-size: 13px; }
  .log li:last-child { border-bottom: 0; }
  .log .tm { font: 500 11.5px/1.9 var(--mono); color: var(--faint); }
  .log .cd { font: 600 10.5px/1.9 var(--mono); letter-spacing: .08em; color: var(--muted); }
  .log .cd.in { color: var(--admissions); } .log .cd.out { color: var(--good); } .log .cd.staff { color: var(--warn); } .log .cd.bad { color: var(--bad); } .log .cd.read { color: var(--intl); }
  .log .tx { color: var(--ink2); overflow-wrap: anywhere; }
  .log q { display: block; margin-top: 4px; padding: 5px 9px; border-left: 2px solid var(--bad); background: var(--bad-soft); color: var(--bad); font-size: 12.5px; quotes: none; }

  /* Outreach to prospective students: its own strip, so it reads as a live action rather than a statistic */
  .outreach { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 18px 22px; margin-bottom: 24px; background: var(--panel); border: 1px solid var(--rule); border-left: 3px solid var(--accent); }
  .outreach h2 { margin: 6px 0 4px; font-size: 18px; letter-spacing: -0.02em; font-weight: 600; }
  .outreach p { margin: 0; color: var(--ink2); font-size: 14px; max-width: 620px; }
  .outreach-act { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .outreach-act .b { white-space: normal; text-align: left; }
  .outreach-act .to { font: 500 12px var(--mono); color: var(--muted); }
  .outreach-act .note { font-size: 12.5px; color: var(--good); max-width: 300px; text-align: right; }
  .outreach-act .note.err { color: var(--bad); }
  .outreach-act .note.wait { color: var(--muted); }
  .hero-empty { background: var(--panel); border: 1px solid var(--rule); padding: 40px 36px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
  .hero-empty h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; font-weight: 600; }
  .hero-empty p { margin: 0; color: var(--ink2); max-width: 560px; }
  .note-line { margin-top: 14px; font-size: 13px; color: var(--muted); }

  @media (max-width: 1200px) {
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi:nth-child(4) { border-left: 0; padding-left: 0; }
    .kpi:nth-child(n+4) { border-top: 1px solid var(--rule); }
    .cols { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 900px) {
    body { grid-template-columns: minmax(0, 1fr); }
    body { grid-template-rows: auto 1fr; }
    .sb { position: static; height: auto; }
    .me { margin-top: 0; }
    .sb-brand { padding: 14px 16px; }
    .nav { flex-direction: row; overflow-x: auto; padding: 6px 8px; }
    .nav .grp { display: none; }
    .nav a { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; }
    .nav a.on { border-bottom-color: #3ccf91; }
    .me { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
    .me .mail, .me .via { display: none; }
    .me form { margin: 0; }
    .topbar, .view { padding-left: 16px; padding-right: 16px; }
    .t .hide-sm { display: none; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi:nth-child(n) { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); }
    .kpi:nth-child(even) { border-left: 1px solid var(--rule); padding-left: 14px; }
    .kpi:nth-child(-n+2) { border-top: 0; }
    .outreach { grid-template-columns: minmax(0, 1fr); }
    .outreach-act { align-items: flex-start; }
    .outreach-act .note { text-align: left; }
    .rows li { grid-template-columns: minmax(0, 1fr) auto; }
    .rows li > :first-child { grid-column: 1 / -1; }
    .log li { grid-template-columns: 62px minmax(0, 1fr); }
    .log .tx { grid-column: 2; }
  }
</style>
</head>
<body>
<aside class="sb">
  <a class="sb-brand" href="/"><img src="/logo.svg" alt=""><div><b>Unicess</b><span>Halden University</span></div></a>
  <nav class="nav" id="nav">
    <div class="grp">Workspace</div>
    <a href="#overview" data-v="overview"><span>Overview</span></a>
    <a href="#review" data-v="review"><span>Review queue</span><em id="n-review"></em></a>
    <a href="#applicants" data-v="applicants"><span>Applicants</span><em id="n-applicants"></em></a>
    <a href="#offices" data-v="offices"><span>Offices</span><em>6</em></a>
    <a href="#safeguards" data-v="safeguards"><span>Safeguards</span><em id="n-safeguards"></em></a>

async function poll() {
  try {
    const res = await fetch(`/api/state?since=${since}`, { cache: "no-store" });
    if (res.status === 401) { location.href = "/login"; return; }
    const s = await res.json();
    if (s.lastId < since) { events = []; since = 0; return poll(); }
    const changed = s.events.length > 0 || s.busy !== busy || s.mode !== mode || JSON.stringify(s.health) !== JSON.stringify(health);
    events.push(...s.events);
    since = s.lastId; cases = s.cases; metrics = s.metrics; health = s.health ?? {}; mode = s.mode; busy = s.busy; domain = s.domain ?? domain;
    // Don't redraw under someone mid-sentence unless something they are looking at changed.
    if (changed) render(); else renderShell();
  } catch {}
}
